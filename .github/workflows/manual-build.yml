name: Manual Container Build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom tag suffix (optional)'
        required: false
        default: 'manual'
        type: string
permissions:
  contents: read
  packages: write
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.event.inputs.tag }}
            ghcr.io/${{ github.repository }}/backend:latest
